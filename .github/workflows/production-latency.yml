name: Production latency measurement
on:
  push:
    branches: [diagnostics/production-latency]
    paths:
      - '.github/workflows/production-latency.yml'
      - 'tests/production-latency.mjs'
      - 'tests/production-success-latency.mjs'
      - 'tests/region-latency.mjs'
permissions:
  contents: read
concurrency:
  group: production-latency-measurement
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install measurement browser
        run: |
          npm install --prefix "$RUNNER_TEMP/latency" --save-exact playwright@1.62.1
          "$RUNNER_TEMP/latency/node_modules/.bin/playwright" install --with-deps chromium
      - name: Wait for deployed authentication phase timings
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/latency/node_modules/playwright/index.mjs
        run: |
          node --input-type=module <<'JS'
          import {pathToFileURL} from 'node:url';
          const {request}=await import(pathToFileURL(process.env.PLAYWRIGHT_MODULE).href);
          const client=await request.newContext();
          const url='https://tradetrack-backend-frankfurt-fxf1.onrender.com/api/auth/login/';
          let ready=false,networkFailures=0;
          for(let attempt=1;attempt<=20;attempt++){
            try{
              const response=await client.post(url,{data:{email:'deployment-probe@example.invalid',password:'SyntheticProbe123!'},timeout:15000});
              const timing=response.headers()['server-timing']||'';
              networkFailures=0;
              console.log(JSON.stringify({attempt,status:response.status(),serverTiming:timing}));
              if(response.status()===401&&timing.includes('password_cpu;dur=')){ready=true;break;}
            }catch(error){console.log(JSON.stringify({attempt,error:error.message.slice(0,300)}));if(++networkFailures>=3)break;}
            if(attempt<20)await new Promise(resolve=>setTimeout(resolve,10000));
          }
          await client.dispose();
          if(!ready)throw new Error('The new authentication timing headers did not appear; production deployment is unconfirmed.');
          JS
      - name: Compare Ohio and Frankfurt before frontend cutover
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/latency/node_modules/playwright/index.mjs
          PROBE_ROUNDS: '6'
          PROBE_CONTROLS: '1'
        run: node tests/region-latency.mjs
      - name: Save timing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-latency
          path: artifacts/production-latency/report.json
          if-no-files-found: ignore
          retention-days: 7
